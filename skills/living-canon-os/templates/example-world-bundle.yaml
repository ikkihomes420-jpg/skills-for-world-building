- kind: decision
  id: decision.delta-charter
  question: Which city controls emergency grain certification?
  options: [Rotate the authority, centralize it, let each city self-certify]
  chosen_option: Rotate the authority annually among member cities.
  rationale: Prevents a permanent hegemon while preserving a shared institution.
  affected_ids: [entity.reed-compact, rule.flood-oath]
  status: approved
  authority: user-approved
  confidence: confirmed
  sources: [source.session-001]
  branch: mainline

